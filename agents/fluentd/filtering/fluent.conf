# =============================================================================
# FLUENTD FILTERING AGENT  -  same job as agents/otel-collector/filtering
# Input : JSON over HTTP, tag = URL path, e.g.  POST /app.alert
# Keeps WARN/ERROR/FATAL, drops probe noise, trims fields, ships to Elastic.
# Needs plugins: fluent-plugin-elasticsearch, fluent-plugin-prometheus
# =============================================================================
<system>
  log_level info
</system>

<source>
  @type http
  bind 0.0.0.0
  port 9880
  body_size_limit 1m
</source>

# ---- self-observability ------------------------------------------------------
<source>
  @type monitor_agent
  bind 0.0.0.0
  port 24220
</source>
<source>
  @type prometheus
  bind 0.0.0.0
  port 24231
</source>
<source>
  @type prometheus_monitor
</source>
<source>
  @type prometheus_output_monitor
</source>

<filter app.alert.**>
  @type prometheus
  <metric>
    name filter_agent_records_in_total
    type counter
    desc Alert records received by the filtering agent
  </metric>
</filter>

# ---- keep only WARN and above, then drop noise -----------------------------------
<filter app.alert.**>
  @type grep
  <regexp>
    key severity
    pattern /^(WARN|WARNING|ERROR|FATAL|CRITICAL)$/i
  </regexp>
  <exclude>
    key message
    pattern /health[-_ ]?check|connection reset by peer/i
  </exclude>
</filter>

<filter app.alert.**>
  @type record_transformer
  remove_keys process.command_line
  <record>
    pipeline.stage filtering-agent
  </record>
</filter>

<filter app.alert.**>                      # count what survived
  @type prometheus
  <metric>
    name filter_agent_records_kept_total
    type counter
    desc Records that survived filtering
  </metric>
</filter>

<match app.alert.**>
  @type copy
  <store>
    @type elasticsearch
    host "#{ENV['ES_HOST'] || 'elasticsearch-master.application-demo.svc.cluster.local'}"
    port "#{ENV['ES_PORT'] || '9200'}"
    scheme https
    ssl_verify false
    api_key "#{ENV['ES_API_KEY_ALERTS']}"  # different key than the debug sink
    index_name otel-logs-alerts
    <buffer>
      flush_interval 1s
    </buffer>
  </store>
  <store>
    @type stdout
  </store>
</match>
