# =============================================================================
# FLUENTD PII REDACTION AGENT  -  same job as agents/otel-collector/pii-redaction
# Input : JSON over HTTP, tag = URL path, e.g.  POST /app.debug
# Output: Elasticsearch (own API key) + stdout so you can eyeball the result
# Needs plugins: fluent-plugin-elasticsearch, fluent-plugin-prometheus
# NOTE: in_http has no API-key check - keep it behind Envoy (it does the auth).
# NOTE: regexes avoid {n,m} quantifiers on purpose: braces inside ${...} can
#       confuse fluentd's placeholder parser.
# =============================================================================
<system>
  log_level info
</system>

<source>
  @type http
  bind 0.0.0.0
  port 9880
  body_size_limit 1m
</source>

# ---- self-observability ------------------------------------------------------
<source>                       # JSON status: curl localhost:24220/api/plugins.json
  @type monitor_agent
  bind 0.0.0.0
  port 24220
</source>
<source>                       # Prometheus metrics: curl localhost:24231/metrics
  @type prometheus
  bind 0.0.0.0
  port 24231
</source>
<source>
  @type prometheus_monitor
</source>
<source>
  @type prometheus_output_monitor
</source>

# ---- 1. count what comes in --------------------------------------------------
<filter app.debug.**>
  @type prometheus
  <metric>
    name pii_agent_records_in_total
    type counter
    desc Debug records received by the PII agent
  </metric>
</filter>

# ---- 2. redact -----------------------------------------------------------------
<filter app.debug.**>
  @type record_transformer
  enable_ruby true
  remove_keys http.request.header.authorization
  <record>
    # free text: email -> SSN -> card -> phone -> ISO date (specific before loose)
    message ${record["message"].to_s.gsub(/[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z][a-zA-Z]+/, "[REDACTED_EMAIL]").gsub(/\b\d\d\d-\d\d-\d\d\d\d\b/, "[REDACTED_SSN]").gsub(/\b(?:\d\d\d\d[ -]?)(?:\d\d\d\d[ -]?)(?:\d\d\d\d[ -]?)\d\d\d\d\b/, "[REDACTED_CC]").gsub(/(?:\+\d\d?\d?[\s.-]?)?\(?\d\d\d\)?[\s.-]?\d\d\d[\s.-]?\d\d\d\d\b/, "[REDACTED_PHONE]").gsub(/\b\d\d\d\d-\d\d-\d\d\b/, "[REDACTED_DATE]")}
    # attribute values that carry the same patterns
    payment.contact ${record["payment.contact"] && record["payment.contact"].to_s.gsub(/[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z][a-zA-Z]+/, "[REDACTED_EMAIL]")}
    payment.card ${record["payment.card"] && "[REDACTED_CC]"}
    # well-known sensitive keys: mask the whole value (null when the key is absent)
    user_name ${record["user_name"] && "[REDACTED_NAME]"}
    address ${record["address"] && "[REDACTED_ADDRESS]"}
    pii.redacted true
  </record>
</filter>

# ---- 3. ship --------------------------------------------------------------------
<match app.debug.**>
  @type copy
  <store>
    @type elasticsearch
    host "#{ENV['ES_HOST'] || 'elasticsearch-master.application-demo.svc.cluster.local'}"
    port "#{ENV['ES_PORT'] || '9200'}"
    scheme https
    ssl_verify false                       # demo only
    api_key "#{ENV['ES_API_KEY_DEBUG']}"   # key scoped to the debug index only
    index_name otel-logs-debug-redacted
    <buffer>
      flush_interval 1s
    </buffer>
  </store>
  <store>
    @type stdout
  </store>
</match>
