# Copy to deploy/k8s/secrets.yaml (git-ignored), edit, then:  kubectl apply -f deploy/k8s/secrets.yaml
# The three *_TOKEN values must equal the Bearer tokens in deploy/envoy/envoy.yaml.
# ES_API_KEY_* are the "encoded" values returned by Elasticsearch POST /_security/api_key (see README).
apiVersion: v1
kind: Secret
metadata:
  name: log-pipeline-secrets
  namespace: application-demo
type: Opaque
stringData:
  ROUTER_TOKEN: router-token-demo
  PII_AGENT_TOKEN: pii-agent-token-demo
  FILTER_AGENT_TOKEN: filter-agent-token-demo
  ES_API_KEY_DEBUG: "<encoded api key limited to otel-logs-debug-redacted>"
  ES_API_KEY_ALERTS: "<encoded api key limited to otel-logs-alerts>"
