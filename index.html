    :root {

      --on-surface: #000000;
      --on-surface-variant: rgba(0, 0, 0, 0.55);
      
      /* Node Colors */
      --color-source: #c84288;
      --color-envoy: #2575fc;
      --color-otel: #705ec2;
      --color-sink: #228a49;

    body {
      margin: 0;
      padding: 20px;
      background: #fafafa;
      font-family: var(--ff-sans);
      color: var(--on-surface);
    }

    .widget-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .widget-header h2 { margin: 0 0 8px 0; font-weight: 600; }
    .widget-header p { margin: 0; color: var(--on-surface-variant); font-size: 14px; }

    /* SVG Viewport */
    .diagram-viewport {
      background: var(--surface-dim);
      border-radius: 12px;
      border: 1px solid var(--stroke-default);
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .diagram-svg {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
    }

    /* SVG Interactions */
    .diag-node { cursor: pointer; transition: filter 0.2s; }
    .diag-node:hover rect { filter: brightness(0.95); }
    .diag-node.is-selected rect { stroke-width: 2.5px !important; }
    .flow-particle { pointer-events: none; }

    /* Details Panel */
    .detail-card {
      background: var(--surface-bright);
      border-radius: 12px;
      border: 1px solid var(--stroke-default);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 200px;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--stroke-default);
      padding-bottom: 12px;
    }

    .detail-header h3 { margin: 0; font-size: 18px; }
    .detail-tag {
      padding: 4px 12px;
      border-radius: 999px;
      font-family: var(--ff-mono);
      font-size: 12px;
      font-weight: 600;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .detail-item { display: flex; flex-direction: column; gap: 4px; }
    .detail-label { font-family: var(--ff-mono); font-size: 11px; color: var(--on-surface-variant); text-transform: uppercase; }
    .detail-value { font-size: 14px; }

    .code-snippet {
      background: var(--surface-dim);
      border-radius: 8px;
      padding: 12px;
      font-family: var(--ff-mono);
      font-size: 12px;
      overflow-x: auto;
      border: 1px solid var(--stroke-default);
      margin: 0;
    }

    /* Legend */
    .legend-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--stroke-default);
      font-size: 12px;
      font-family: var(--ff-mono);
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }
  </style>
</head>
